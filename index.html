<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع محمد</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background-color: #0a0a0a;
      padding: 20px;
      border-bottom: 2px solid #22c55e;
    }

    header h1 {
      color: #22c55e;
      font-size: 28px;
    }

    .hero {
      padding: 80px 20px;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    .hero h2 span {
      color: #22c55e;
    }

    .hero p {
      font-size: 20px;
      color: #aaaaaa;
      margin-bottom: 40px;
    }

    .btn {
      background-color: #22c55e;
      color: #000000;
      padding: 15px 40px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background-color: #16a34a;
    }

    .skills {
      padding: 60px 20px;
      background-color: #111111;
    }

    .skills h3 {
      font-size: 30px;
      color: #22c55e;
      margin-bottom: 40px;
    }

    .skills-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .skill-card {
      background-color: #1a1a1a;
      border: 1px solid #22c55e;
      border-radius: 12px;
      padding: 30px 40px;
      font-size: 18px;
      width: 160px;
    }

    .skill-card span {
      display: block;
      font-size: 40px;
      margin-bottom: 10px;
    }

    footer {
      padding: 30px;
      background-color: #0a0a0a;
      border-top: 2px solid #22c55e;
      color: #aaaaaa;
      font-size: 16px;
    }

    footer span {
      color: #22c55e;
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <h1>موقع محمد</h1>
  </header>

  <!-- القسم الرئيسي -->
  <div class="hero">
    <h2>مرحباً، أنا <span>محمد</span></h2>
    <p>مصمم مواقع إلكترونية 💻</p>
    <a class="btn" href="mailto:mohammadakil1995145@gmail.com">تواصل معي</a>
  </div>

  <!-- المهارات -->
  <div class="skills">
    <h3>مهاراتي</h3>
    <div class="skills-grid">
      <div class="skill-card">
        <span>🌐</span>
        HTML
      </div>
      <div class="skill-card">
        <span>🎨</span>
        CSS
      </div>
      <div class="skill-card">
        <span>⚙️</span>
        JavaScript
      </div>
    </div>
  </div>

  <!-- الفوتر -->
  <footer>
    <p>صمم بـ ❤️ بواسطة <span>محمد</span></p>
  </footer>

</body>
</html>
